name: deploy
# CI/CD for C2 (Intelligent Test Case Generation) on the NextGenQA EC2 box.
# Two jobs run on the self-hosted runner (no inbound SSH). Code is fetched with
# actions/checkout (ephemeral GITHUB_TOKEN — no PAT on the box) and rsync'd into
# the deploy folder (gitignored .env preserved).
#
#   test   → builds the image and runs unit + integration tests INSIDE it.
#   deploy → runs ONLY if `test` passes (needs: test); rebuilds (cache hit) and
#            switches traffic to the new container.
on:
  push:
    branches: [feature/aws-deploy]
  workflow_dispatch:

concurrency:
  group: deploy-test-case
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: [self-hosted, nextgenqa]
    steps:
      - name: Check out the pushed code
        uses: actions/checkout@v4
        with:
          ref: feature/aws-deploy

      - name: Sync code into the deploy folder
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.env' --exclude='backend/.env' --exclude='repair-agent/.env' ./ ~/Intelligent-Test-Case-Generation/

      - name: Build the image
        run: |
          set -euo pipefail
          cd ~/deploy
          docker compose -f docker-compose.prod.yml --env-file .env build test-case

      # tests/ is bind-mounted (kept out of the prod image), --no-deps avoids
      # starting auth/db, and the suite is hermetic (no DB/network). A failing
      # test exits non-zero → this job fails → `deploy` is skipped.
      - name: Run unit + integration tests
        run: |
          set -euo pipefail
          cd ~/deploy
          docker compose -f docker-compose.prod.yml --env-file .env run --rm --no-deps \
            -v "$HOME/Intelligent-Test-Case-Generation/backend/tests:/app/tests:ro" \
            -v "$HOME/Intelligent-Test-Case-Generation/backend/pytest.ini:/app/pytest.ini:ro" \
            --entrypoint sh test-case -c "cd /app && python -m pytest tests -q"

  deploy:
    name: deploy
    needs: test
    runs-on: [self-hosted, nextgenqa]
    steps:
      - name: Check out the pushed code
        uses: actions/checkout@v4
        with:
          ref: feature/aws-deploy

      - name: Sync code into the deploy folder
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.env' --exclude='backend/.env' --exclude='repair-agent/.env' ./ ~/Intelligent-Test-Case-Generation/

      - name: Rebuild & restart the service
        run: |
          set -euo pipefail
          cd ~/deploy
          docker compose -f docker-compose.prod.yml --env-file .env up -d --build test-case

      - name: Prune dangling images
        run: docker image prune -f
