name: deploy
# Auto-deploy to the NextGenQA EC2 box on push to the deploy branch.
# Runs on the self-hosted runner ON the box (no inbound SSH). The code is
# fetched via actions/checkout using the ephemeral GITHUB_TOKEN — so NO
# personal access token needs to live on the box, and revoking any PAT can't
# break this. rsync copies the checked-out code into the deployed folder
# (preserving the gitignored .env files), then only this service is rebuilt.
on:
  push:
    branches: [feature/aws-deploy]
  workflow_dispatch:

concurrency:
  group: deploy-test-case
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nextgenqa]
    steps:
      - name: Check out the pushed code
        uses: actions/checkout@v4
        with:
          ref: feature/aws-deploy

      - name: Sync code into the deploy folder
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.env' --exclude='backend/.env' --exclude='repair-agent/.env' ./ ~/Intelligent-Test-Case-Generation/

      - name: Build the image
        run: |
          set -euo pipefail
          cd ~/deploy
          docker compose -f docker-compose.prod.yml --env-file .env build test-case

      # ── Deploy gate: run unit + integration tests INSIDE the freshly built
      # image before switching traffic to it. tests/ is bind-mounted (kept out
      # of the production image), --no-deps avoids starting auth/db, and the
      # suite is hermetic (no DB/network). A non-zero exit fails the job here,
      # so the running container is left untouched.
      - name: Run unit + integration tests (deploy gate)
        run: |
          set -euo pipefail
          cd ~/deploy
          docker compose -f docker-compose.prod.yml --env-file .env run --rm --no-deps \
            -v "$HOME/Intelligent-Test-Case-Generation/backend/tests:/app/tests:ro" \
            -v "$HOME/Intelligent-Test-Case-Generation/backend/pytest.ini:/app/pytest.ini:ro" \
            --entrypoint sh test-case -c "cd /app && python -m pytest tests -q"

      - name: Deploy (only if tests passed)
        run: |
          set -euo pipefail
          cd ~/deploy
          docker compose -f docker-compose.prod.yml --env-file .env up -d test-case

      - name: Prune dangling images
        run: docker image prune -f
