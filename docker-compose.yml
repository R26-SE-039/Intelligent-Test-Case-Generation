services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgenqa_backend
    ports:
      - "8002:8002"
    # All runtime config (DATABASE_URL, LLM_API_KEY, GITHUB_TOKEN, ...) comes
    # from backend/.env. Point DATABASE_URL at your Neon database there, e.g.
    #   DATABASE_URL=postgresql://neondb_owner:PASS@ep-xxx.ap-southeast-1.aws.neon.tech/nextgen_qa?sslmode=require
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
